<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemLab Project</title>
  
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0a0e1a;
      --card-bg: #131a30;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .screen { display: none; width: 100%; max-width: 500px; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    .screen.active { display: block; }

    h1 { font-size: 2rem; margin-bottom: 20px; color: var(--text); }
    h2 { font-size: 1.5rem; margin-bottom: 15px; color: var(--text-muted); }
    
    input {
      width: 100%; padding: 14px; background: #1e294b; border: 2px solid #334155; border-radius: 8px; color: white; font-size: 1.1rem; margin-bottom: 15px; text-align: center; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }

    button {
      width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 8px; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button.success { background: var(--accent); }
    button.danger { background: var(--danger); }
    button.danger:hover { background: var(--danger-hover); }

    .qr-container { background: white; padding: 15px; border-radius: 12px; display: inline-block; margin: 20px 0; }
    .qr-container img { display: block; max-width: 100%; height: auto; }
    
    .room-code-display { font-size: 3rem; font-weight: bold; letter-spacing: 4px; color: var(--primary); margin: 15px 0; }
    
    .player-list { text-align: left; margin: 20px 0; max-height: 250px; overflow-y: auto; }
    .player-item { display: flex; justify-content: space-between; padding: 10px 15px; background: #1e294b; margin-bottom: 8px; border-radius: 6px; }
    .player-item .score { font-weight: bold; color: var(--accent); }

    /* Dynamické herní prvky pro stavění molekul */
    #targetMolecule { font-size: 1.6rem; font-weight: bold; color: #facc15; margin-bottom: 10px; }
    #gameCanvas { background: #111827; border-radius: 12px; width: 100%; min-height: 120px; margin: 15px 0; border: 2px dashed #4b5563; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; padding: 15px; gap: 8px; }
    .canvas-placeholder { color: var(--text-muted); pointer-events: none; }
    
    .atom-built { background: var(--primary); color: white; padding: 10px 16px; border-radius: 50%; font-weight: bold; font-size: 1.2rem; min-width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    
    .chem-controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
    .btn-atom { background: #1e294b; border: 2px solid #334155; color: white; padding: 10px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
    .btn-atom:hover { background: #2e3b6e; border-color: var(--primary); }
    
    .action-controls { display: flex; gap: 10px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div id="menuScreen" class="screen active">
    <h1>🧪 ChemLab Project</h1>
    <input type="text" id="playerNameInput" placeholder="Zadej své jméno" maxlength="18">
    <input type="text" id="roomCodeInput" placeholder="Kód místnosti (např. A1B2)" style="text-transform: uppercase;">
    <button onclick="handleJoin()">Připojit se do hry</button>
    <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
    <button class="secondary" onclick="createRoom()">Vytvořit hru (Učitel)</button>
  </div>

  <div id="hostScreen" class="screen">
    <h1>Místnost učitele</h1>
    <p>Žáci se mohou připojit zadáním kódu nebo naskenováním QR:</p>
    <div class="room-code-display" id="roomCode">------</div>
    
    <div class="qr-container">
      <img id="qrImage" alt="QR kód pro připojení">
    </div>
    
    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px;" id="joinUrl">---</p>
    
    <h2>Připojení žáci (<span id="playerCount">0</span>)</h2>
    <div class="player-list" id="hostPlayerList"></div>
    
    <button class="success" onclick="startGame()">🚀 Spustit hru všem</button>
  </div>

  <div id="waitingScreen" class="screen">
    <h1>Jsi ve hře!</h1>
    <p style="color: var(--text-muted); margin-bottom: 20px;">Počkej, až učitel spustí společnou hru...</p>
    <h2>Ostatní v lobby:</h2>
    <div class="player-list" id="waitingPlayerList"></div>
  </div>

  <div id="gameScreen" class="screen">
    <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
      <div>Čas: <span id="gameTimer" style="font-weight: bold; color: #ef4444;">--</span> s</div>
      <div>Moje skóre: <span id="gameScore" style="font-weight: bold; color: var(--accent);">0</span></div>
    </div>
    
    <h1>Sestav molekulu</h1>
    <div id="targetMolecule">Načítání úkolu...</div>
    
    <div id="gameCanvas"></div>
    
    <div class="chem-controls">
      <button class="btn-atom" onclick="addAtom('H')">H</button>
      <button class="btn-atom" onclick="addAtom('O')">O</button>
      <button class="btn-atom" onclick="addAtom('C')">C</button>
      <button class="btn-atom" onclick="addAtom('N')">N</button>
    </div>

    <div class="action-controls">
      <button class="secondary" style="margin:0;" onclick="removeLastAtom()">↩ Smazat</button>
      <button class="danger" style="margin:0;" onclick="clearCanvas()">🗑️ Reset</button>
    </div>
    
    <button class="success" onclick="checkAndSubmitAnswer()">Odeslat správnou molekulu (+20b)</button>
  </div>

  <div id="leaderboardScreen" class="screen">
    <h1>🏆 Výsledky hry</h1>
    <div class="player-list" id="finalPlayerList"></div>
    <button onclick="resetApp()">Zpět na hlavní menu</button>
  </div>

  <script>
    // GLOBÁLNÍ STAV HRY
    const state = {
      room: null,
      hostKey: null,
      sessionId: null,
      playerName: '',
      role: 'player', // 'player' | 'host'
      multiplayer: false,
      score: 0
    };

    let pollingInterval = null;

    // CHEMICKÝ ENGINE: Databáze podporovaných molekul a aktuální stav plátna
    const MOLECULES_DB = [
      { name: "Voda (H₂O)", formula: ["H", "H", "O"] },
      { name: "Oxid uhličitý (CO₂)", formula: ["C", "O", "O"] },
      { name: "Metan (CH₄)", formula: ["C", "H", "H", "H", "H"] },
      { name: "Amoniak (NH₃)", formula: ["N", "H", "H", "H"] },
      { name: "Kyslík (O₂)", formula: ["O", "O"] },
      { name: "Dusík (N₂)", formula: ["N", "N"] }
    ];
    
    let currentTask = null;
    let builtFormula = [];

    // Generování nové otázky
    function generateNewTask() {
      const randomIndex = Math.floor(Math.random() * MOLECULES_DB.length);
      currentTask = MOLECULES_DB[randomIndex];
      document.getElementById('targetMolecule').textContent = currentTask.name;
      clearCanvas();
    }

    // Přidání atomu na plátno
    function addAtom(element) {
      builtFormula.push(element);
      renderCanvas();
    }

    // Smazání posledního přidaného atomu
    function removeLastAtom() {
      builtFormula.pop();
      renderCanvas();
    }

    // Úplné vyčištění plátna
    function clearCanvas() {
      builtFormula = [];
      renderCanvas();
    }

    // Vykreslení atomů do vizuálního pole
    function renderCanvas() {
      const canvas = document.getElementById('gameCanvas');
      if (builtFormula.length === 0) {
        canvas.innerHTML = '<div class="canvas-placeholder">Klikáním na prvky níže sestav molekulu</div>';
        return;
      }
      
      canvas.innerHTML = builtFormula.map(atom => `<div class="atom-built">${atom}</div>`).join('');
    }

    // Kontrola správnosti a odeslání výsledku
    function checkAndSubmitAnswer() {
      if (!currentTask) return;

      // Seřadíme pole abychom ignorovali pořadí, v jakém žák atomy naklikal
      const currentSorted = [...builtFormula].sort();
      const targetSorted = [...currentTask.formula].sort();

      const isCorrect = currentSorted.length === targetSorted.length && 
                        currentSorted.every((val, index) => val === targetSorted[index]);

      if (isCorrect) {
        alert('Správně! Získáváš 20 bodů. 🎉');
        submitScoreDelta(20);
        generateNewTask();
      } else {
        alert('Takhle tato molekula nevypadá, zkus to znovu! ❌');
      }
    }

    // ── localStorage: uložení / obnovení / smazání progressu žáka ─────────────
    const LS_KEY = 'chemlab_progress';

    function saveProgress() {
      if (state.role !== 'player' || !state.sessionId) return;
      const data = {
        room:       state.room,
        sessionId:  state.sessionId,
        playerName: state.playerName,
        score:      state.score,
        savedAt:    Date.now(),
      };
      localStorage.setItem(LS_KEY, JSON.stringify(data));
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        // Platný pouze 2 hodiny
        if (Date.now() - data.savedAt > 2 * 60 * 60 * 1000) {
          localStorage.removeItem(LS_KEY);
          return null;
        }
        return data;
      } catch { return null; }
    }

    function clearProgress() {
      localStorage.removeItem(LS_KEY);
    }
    // ──────────────────────────────────────────────────────────────────────────

    // Načtení parametrů z URL adresy (pokud žák naskenoval QR)
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      const hostParam = params.get('host');

      // Pokus o obnovení předchozího progressu žáka
      const saved = loadProgress();
      if (saved && !roomParam && !hostParam) {
        const resume = confirm(`Pokračovat jako "${saved.playerName}" v místnosti ${saved.room}? (${saved.score} b)`);
        if (resume) {
          state.room       = saved.room;
          state.sessionId  = saved.sessionId;
          state.playerName = saved.playerName;
          state.score      = saved.score;
          state.role       = 'player';
          state.multiplayer = true;
          document.getElementById('gameScore').textContent = state.score;
          generateNewTask();
          startPolling();
          showScreen('waitingScreen');
          return;
        } else {
          clearProgress();
        }
      }

      if (roomParam) {
        document.getElementById('roomCodeInput').value = roomParam.toUpperCase();
        state.room = roomParam.toUpperCase();
        
        if (hostParam) {
          state.hostKey = hostParam;
          state.role = 'host';
          state.room = roomParam.toUpperCase();
          startPolling();
          showScreen('hostScreen');
        }
      }
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // TLAČÍTKO PŘIPOJIT SE (ŽÁK)
    function handleJoin() {
      const name = document.getElementById('playerNameInput').value.trim();
      const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();

      if (!name || !code) {
        alert('Vyplň své jméno a kód místnosti!');
        return;
      }

      state.room = code;
      joinRoom(name);
    }

    // 1. VYTVOŘENÍ MÍSTNOSTI (UČITEL)
    async function createRoom() {
      try {
        const res = await fetch('/api/server/rooms', { method: 'POST' });
        if (!res.ok) throw new Error('Selhalo vytvoření místnosti na serveru');
        const data = await res.json();

        state.room = data.room;
        state.hostKey = data.hostKey;
        state.role = 'host';
        state.multiplayer = true;

        document.getElementById('roomCode').textContent = data.room;
        document.getElementById('joinUrl').textContent = data.joinUrl;

        // Vygenerování QR kódu rovnou na frontendu
        try {
          QRCode.toDataURL(data.joinUrl, { width: 320, margin: 1 }, function (err, url) {
            if (err) {
              alert('QR chyba: ' + err);
            } else if (url) {
              document.getElementById('qrImage').src = url;
            } else {
              alert('QR: funkce proběhla ale url je prázdná');
            }
          });
        } catch (qrErr) {
          alert('QRCode není dostupný: ' + qrErr.message);
        }

        startPolling(); 
        showScreen('hostScreen');
      } catch (err) {
        alert('Chyba serveru: ' + err.message);
      }
    }

    // 2. PŘIPOJENÍ ŽÁKA DO MÍSTNOSTI
    async function joinRoom(name) {
      try {
        const res = await fetch('/api/server/join', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ room: state.room, name: name })
        });
        
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || 'Nepodařilo se připojit');
        }
        
        const data = await res.json();
        state.sessionId = data.sessionId;
        state.playerName = name;
        state.role = 'player';
        state.multiplayer = true;
        
        generateNewTask();
        saveProgress();
        startPolling();
        showScreen('waitingScreen');
      } catch (err) {
        alert(err.message);
      }
    }

    // 3. START POLLINGU (Dotazování Vercelu každých 1.5 vteřiny)
    function startPolling() {
      if (pollingInterval) clearInterval(pollingInterval);
      fetchRoomStatus();
      pollingInterval = setInterval(fetchRoomStatus, 1500);
    }

    async function fetchRoomStatus() {
      if (!state.room) return;
      
      try {
        let url = `/api/server/room?room=${encodeURIComponent(state.room)}`;
        if (state.role === 'host' && state.hostKey) {
          url += `&hostKey=${encodeURIComponent(state.hostKey)}`;
        }
        
        const res = await fetch(url);
        if (!res.ok) return;
        
        const snapshotData = await res.json();
        applyRoomSnapshot(snapshotData);
      } catch (e) {
        console.error("Chyba synchronizace dat:", e);
      }
    }

    // 4. APLIKACE DAT ZE SERVERU DO UI
    function applyRoomSnapshot(snapshot) {
      // Synchronizace časovače a stavu obrazovek
      if (state.role === 'player') {
        if (snapshot.status === 'running' && document.getElementById('waitingScreen').classList.contains('active')) {
          showScreen('gameScreen');
        }
        if (snapshot.status === 'finished' && !document.getElementById('leaderboardScreen').classList.contains('active')) {
          clearInterval(pollingInterval);
          showScreen('leaderboardScreen');
        }
      } else if (state.role === 'host') {
        if (snapshot.status === 'finished' && !document.getElementById('leaderboardScreen').classList.contains('active')) {
          clearInterval(pollingInterval);
          showScreen('leaderboardScreen');
        }
      }

      document.getElementById('gameTimer').textContent = snapshot.timeLeft;

      // Aktualizace seznamů hráčů
      updatePlayerLists(snapshot.players);
    }

    function updatePlayerLists(players) {
      document.getElementById('playerCount').textContent = players.length;
      
      let html = '';
      players.forEach((p, index) => {
        html += `<div class="player-item">
          <span>${index + 1}. ${p.name}</span>
          <span class="score">${p.score} b</span>
        </div>`;
      });

      document.getElementById('hostPlayerList').innerHTML = html;
      document.getElementById('waitingPlayerList').innerHTML = html;
      document.getElementById('finalPlayerList').innerHTML = html;
    }

    // 5. START HRY UČITELEM
    async function startGame() {
      if (!state.room || !state.hostKey) return;
      try {
        await fetch('/api/server/start', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ room: state.room, hostKey: state.hostKey })
        });
        showScreen('gameScreen'); // Přepne i učitele na sledování hry
      } catch (err) {
        console.error(err);
      }
    }

    // 6. ODESLÁNÍ SKÓRE NA SERVER PO SPRÁVNÉ ODPOVĚDI
    async function submitScoreDelta(delta) {
      state.score += delta;
      document.getElementById('gameScore').textContent = state.score;
      saveProgress();

      if (!state.multiplayer || !state.room || !state.sessionId) return;
      try {
        await fetch('/api/server/score', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            room: state.room,
            sessionId: state.sessionId,
            delta: delta
          })
        });
      } catch (err) {
        console.error("Chyba odesílání skóre:", err);
      }
    }

    function resetApp() {
      if (pollingInterval) clearInterval(pollingInterval);
      clearProgress();
      state.room = null;
      state.hostKey = null;
      state.sessionId = null;
      state.score = 0;
      document.getElementById('gameScore').textContent = '0';
      window.history.pushState({}, document.title, "/");
      showScreen('menuScreen');
    }
  </script>
</body>
</html>
